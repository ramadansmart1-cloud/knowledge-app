<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>موسوعة المعرفة – Million Questions</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
    body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="glass sticky top-0 z-50 px-4 py-3 flex justify-between items-center border-b border-slate-800">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-brain text-xl"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight">موسوعة المعرفة</h1>
        <p class="text-xs text-indigo-400 font-semibold">Million Questions</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="app.openDashboard()" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-xl text-slate-300 transition" title="لوحة التحكم">
        <i class="fa-solid fa-gear"></i>
      </button>
      <button onclick="app.toggleTheme()" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-xl text-slate-300 transition" title="المظهر">
        <i class="fa-solid fa-moon" id="theme-icon"></i>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container mx-auto px-4 py-6 max-w-md flex-1 flex flex-col" id="app-view">
    <!-- Dynamic Views loaded via JS -->
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="glass sticky bottom-0 z-50 px-6 py-3 flex justify-between items-center border-t border-slate-800 text-slate-400">
    <button onclick="app.navigate('home')" class="flex flex-col items-center gap-1 hover:text-indigo-400 transition" data-nav="home">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="text-[10px]">الرئيسية</span>
    </button>
    <button onclick="app.navigate('categories')" class="flex flex-col items-center gap-1 hover:text-indigo-400 transition" data-nav="categories">
      <i class="fa-solid fa-layer-group text-lg"></i>
      <span class="text-[10px]">المجالات</span>
    </button>
    <button onclick="app.navigate('search')" class="flex flex-col items-center gap-1 hover:text-indigo-400 transition" data-nav="search">
      <i class="fa-solid fa-magnifying-glass text-lg"></i>
      <span class="text-[10px]">بحث</span>
    </button>
    <button onclick="app.navigate('stats')" class="flex flex-col items-center gap-1 hover:text-indigo-400 transition" data-nav="stats">
      <i class="fa-solid fa-chart-pie text-lg"></i>
      <span class="text-[10px]">الإحصائيات</span>
    </button>
    <button onclick="app.navigate('bookmarks')" class="flex flex-col items-center gap-1 hover:text-indigo-400 transition" data-nav="bookmarks">
      <i class="fa-solid fa-bookmark text-lg"></i>
      <span class="text-[10px]">المفضلة</span>
    </button>
  </nav>

  <!-- Script Core -->
  <script src="app.js"></script>
</body>
</html>
